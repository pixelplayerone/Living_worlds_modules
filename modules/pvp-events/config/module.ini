# PvP Events module
# Master on/off switch. With this False the module does nothing and the server is stock.
# Needs FakePlayers on and PhantomPvpEnabled = True in config/Custom/FakePlayers.ini.
# Set it to True and restart to add the "PvP Events" tab to the Community Board (Alt+B). Chat command: .pvpevent

TabLabel = PvP Events

# The arena, by zone name (see data/zones/pvp.xml). The first one that exists is used for the fight; you are only sent home
# for leaving all the listed ones. colosseum_battle3 is the middle of the Coliseum; battle1 and battle2 are the two bands
# either side of it. gludin_pvp, dion_monster_pvp and giran_pvp_battle also work.
Arenas = colosseum_battle3,colosseum_battle1,colosseum_battle2

# You cannot start an event below this level. The bots come at your level.
MinPlayerLevel = 20
# Bots are made within this many levels of yours (0 = exactly your level).
LevelSpread = 0
# The +level on a bot's weapon and armor, picked between these.
EnchantMin = 0
EnchantMax = 3

# The most fighters on one side, you included. A party holds nine, so 10 is the most that gets a full party.
MaxPerSide = 10
# The most fighters in a free-for-all, you included.
MaxFfa = 30
# Seconds you get to buff after you arrive, before the fight starts. The bots buff too and wait for the same timer.
PrepSeconds = 15

# Defaults for every scenario (a scenario can override kills, minutes and respawn on its own line).
# Respawn True: the dead come back after RespawnSeconds at their start spot; first team to DefaultKills wins.
# Respawn False: nobody comes back; the last team standing wins.
Respawn = True
RespawnSeconds = 3
# queue scenarios: seconds after the fighter in play falls before the next one is let loose.
QueueSeconds = 5
DefaultKills = 15
DefaultMinutes = 5

# Adena for you: per kill, and for being on the winning team. 0 = off.
KillAdena = 0
WinAdena = 0

# Open the results table when an event ends.
ShowResults = True

# Scenarios, up to 12 (Scenario1 .. Scenario12). A blank line removes one.
# Format:  Name | side vs side | options
#   A side is a comma list. "you" is you (one side only). Everything else is  [N x] role-or-class
#   Roles: tank, warrior, archer, dagger, monk, singer, dancer, nuker, healer, buffer, bounty, any
#   Classes: any class name, e.g. Gladiator, Phoenix Knight, Hierophant
#   Options (all optional): kills=N, minutes=N, respawn=on|off, queue=on|off|both
#   queue=on (with respawn=off): the bots facing you wait frozen and come one at a time
#   queue=both (with respawn=off): each side sends one fighter at a time (Korean style)
# Leave out the "vs" and list one side for a free-for-all: everyone fights everyone, no teams, no parties.
# In a team scenario each side is put in its own party for the event.
# Leave "you" out to watch bots fight.
# You come in with your buffs stripped and get the same buffs the bots arrive with (at the start and after every respawn).
# When the timer ends everybody is healed to full HP, MP and CP before the fight starts.
Scenario1 = FFA Deathmatch | you, 29xany | kills=15, minutes=8
Scenario2 = King of the Hill | you, 29xany | respawn=off, minutes=8
Scenario3 = Team Deathmatch | you, 4xany vs 5xany | respawn=off
Scenario4 = Korean Deathmatch | you, 4xany vs 5xany | respawn=off, queue=both, minutes=10
Scenario5 = 1v1 Duel | you vs 1xany | respawn=off
Scenario6 = 9v9 Team Deathmatch | you, 8xany vs 9xany | respawn=off, minutes=8
