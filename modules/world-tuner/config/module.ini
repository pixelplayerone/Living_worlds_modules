# World Tuner module
# Master on/off switch. With this False the module does nothing and the server is stock.
# Set it to True and restart to apply the settings below.
Enabled = False

# How much faster monsters respawn, in percent. 50 = respawns are 50% faster. 100 = twice as fast.
# 0 = stock. A negative number slows respawns down (-50 = half speed).
# Spawn points that never respawn stay that way.
RespawnSpeedPercent = 50

# Never let a scaled respawn drop below this many seconds.
MinRespawnSeconds = 5

# Spawn count multiplier. 1.0 = stock. 2.0 = every spawn point gets one extra monster.
# Fractions work by chance: 1.5 gives about half of the spawn points an extra monster,
# 0.5 switches off about half of the spawn points for good.
SpawnCountMultiplier = 1.0

# How far (in game units) extra monsters are scattered around their spawn point. 150 is about a screen's width of pack.
# 0 puts them all on the same spot.
ExtraSpawnSpread = 150

# Safety cap on how many extra monsters one spawn point can gain.
MaxExtraPerSpawn = 4

# Only change monsters in this level range (the monster's level).
MinLevel = 1
MaxLevel = 85

# Only change these regions. Empty = everywhere. Region names are the folder names in data/spawns,
# for example: Gludio, Dion, Oren, Aden, Giran, Goddard, Rune, Schuttgart, Innadril, Hunters,
# TalkingIsland, DwarvenTerritory, ElvenTerritory, DarkElfTerritory, OrcTerritory.
# Example: Regions = Gludio, Dion
Regions =

# Monster ids that are never changed, comma separated.
ExcludeNpcIds =

# Per-monster settings, which win over the level range and regions above.
# Format: monsterId:countMultiplier:respawnSpeedPercent, separated by semicolons.
# Example: Overrides = 20001:2.0:50;20002:1.0:100
Overrides =

# Raid bosses, minions, instance monsters, town NPCs and quest spawns are never touched.
