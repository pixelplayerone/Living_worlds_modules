# Phantom Management module
# Master on/off switch. With this False the module does nothing and the server is stock.
Enabled = True

# Permanent Friends (Phantoms > Friends > New friend)
# Maximum Friends one player can have in total (their whole friend list). 0 = unlimited (not recommended).
# A Friend created here and later removed from the friend list is still saved on the server, so it keeps counting
# toward this limit. Add it back as a friend instead of creating a new one.
MaxFriendsPerPlayer = 10
# Seconds a player must wait between two Friend creations.
FriendCreateCooldownSeconds = 120
# True = the first click on a class only asks; clicking the same class again (name box empty) creates the Friend.
ConfirmFriendCreation = True
# Forbidden name fragments, comma separated, matched anywhere in the name (case-insensitive). They are added to the
# server's own ForbiddenNames list (config/Player.ini), which Friend names also obey.
ExtraForbiddenNames = gm,admin,moderator,staff,system,fuck,shit,bitch,cunt,dick,pussy,whore,slut,fag,nigg,rape,nazi,hitler

# Live refresh of the Party / Targets / Cubics pages while the panel is open.
# AutoRefresh = False turns it off (pages then update only when you click).
# AutoRefreshSeconds = 0 refreshes always (it only stops when another window such as an NPC dialog or //admin
# replaces the panel). A value of 5-600 stops the refresh that many seconds after your last click, which limits
# how long the panel can reappear after being closed with the X (the client never tells the server about that).
AutoRefresh = True
AutoRefreshSeconds = 0
