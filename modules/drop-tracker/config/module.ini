# Drop Tracker module
# Master on/off switch. With this False the module does nothing and the server is stock.
# Set it to True and restart to register the .drops voiced command.
Enabled = False

# Adena value of one Ancient Adena, used to price seal stones in the report.
# Low / mid / high are all printed so you can see the spread.
AncientAdenaPriceLow = 12
AncientAdenaPriceMid = 15
AncientAdenaPriceHigh = 18

# How many gained items are listed in the in-game report (the server log always lists all of them).
TopItemLines = 12

# Append one summary row per run to a CSV file (path is relative to the game server folder).
WriteCsv = True
CsvFile = log/drop-tracker.csv

# A run that ends because its owner logged out is always written to the server log. Also add it to the CSV?
# Off by default: such a run is usually an abandoned one.
WriteCsvOnLogout = False
