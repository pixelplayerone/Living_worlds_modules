# Auto Potions module
# Master on/off switch. With this False the module does nothing and the server is stock.
# Set it to True and restart. In game: .pots toggles it; .pots hp 60 / .pots mp 50 / .pots cp 95 change a line;
# a line can be turned off with .pots cp off; .pots status shows the settings.
Enabled = False

# How often (milliseconds) each player who has it on is checked. 250 keeps CP and mana potions (0.5 s reuse) spammed.
TickMillis = 250

# The percent a stat must fall under before a potion is drunk. These are the starting lines; every player can change theirs.
DefaultCpPercent = 90
DefaultHpPercent = 70
DefaultMpPercent = 70

# Parallel potions: every potion in these lists is drunk whenever it is off reuse, each on its own timer. With the
# defaults HP uses the Quick Healing Potion (0.5 s reuse) and the Greater Healing Potion (10 s reuse) together.
# Leave a list empty to turn that off.
CpParallelIds =
HpParallelIds = 1540,1539
MpParallelIds =

# Fallback potion ids, best first. Used only when you carry none of the parallel potions for that kind. If the first is
# cooling down or runs out, the next is used.
CpItemIds = 5592,5591
HpItemIds = 1061,1060
MpItemIds = 728

# Keep using potions inside Olympiad matches.
AllowInOlympiad = False

# A chat line every time a potion is used (noisy). Off by default.
Messages = False

# One chat line when a kind of potion runs out.
OutOfPotionsWarning = True

# A player who left it on gets it back on at the next login.
RememberAcrossLogin = True
