# Phantom Encounters module
# Master on/off switch. With this False the module does nothing and the server is stock.
# Needs FakePlayers and PhantomPvpEnabled = True in config/Custom/FakePlayers.ini.
# Set it to True and restart to turn it on.
Enabled = False

# Phantoms come for you in the field and fight ONE fight: until you die or they die, then they leave.
# Never in town or peace zones, never in a duel, instance, siege, or the Olympiad.
#
# Kinds, easiest first:
#   Wimp      a couple of levels under you; walks up and attacks the moment it arrives.
#   Normie    your level; walks up and attacks the moment it arrives.
#   Hard      a few levels over you, +3-4 gear; waits for you to stand still or fight a monster, then strikes.
#   Horsemen  a group, well over you, +5-7 gear; attacks the moment it reaches you.
#   Pker      ONE phantom (named below) far over you with a full +16 set; the extinction event.
# Wimp, Normie, Hard and Horsemen send as many phantoms as you have party members. Horsemen never send fewer
# than HorsemenMinSize. Pker is always one.
#   PkParty   a party of PK players (3-6): archer, mage, melee or mixed, maybe a tank, maybe a healer per four. Normal names.
#   PveParty  only in farming areas (Contested Farming Zones): a tank, a healer, a Fortune Seeker and one damage dealer
#             per member of your party, who want your spot. They ask first or just attack. (Its timer is off.)
# Horsemen: a Cardinal, a Titan, a Storm Screamer and a Duelist; each member beyond four adds one more from a fixed pool of
# five (Adventurer, Hell Knight, Soultaker, Cardinal, Sagittarius), none twice. The Pker is a Titan or a Duelist.
# Rarely (NoveltyPartyPercent) a PK or PvE party turns out to be all archers, all mages, all melee, all tanks, all
# Fortune Seekers, or one class over and over.

# Players below this level are never targeted at all (each kind also has its own unlock level below).
MinPlayerLevel = 10

# After any encounter starts, no other kind can start for this many minutes (so due kinds never pile up).
GapMinutes = 5

# Most encounters running at once across the whole server (a whole group counts as one).
MaxActive = 2

# Most phantoms in one encounter, however big your party is.
MaxActors = 12

# The Horsemen send at least this many phantoms, even when you are alone.
HorsemenMinSize = 4

# The lone Pker's name.
PkerName = AssMuncher

# Which classes AssMuncher can be. Bag: a mix of mage, summoner, archer, dagger, Duelist, Titan and Grand Khavatari
# (common) and a tank or Dreadnought (less common), dealt from a shuffled bag per player so the same one never comes twice
# in a row. TitanDuelist: only a Titan or a Duelist.
PkerClasses = Bag

# PK parties: how many members (3 to 6 by default).
PkPartyMinSize = 3
PkPartyMaxSize = 6

# Chance (percent) that a PK or PvE party is an all-alike party instead (all archers, mages, melee, tanks, Fortune
# Seekers, or one class repeated). Rare on purpose.
NoveltyPartyPercent = 4.0
# (For now the Pker always comes as a Titan.)

# The Horsemen and the Pker spawn with a red name (this much karma). 0 = no red name.
# They also carry enough PK kills that, when you kill them, the server's normal karma drop rules apply
# (Rates.ini KarmaRateDrop*, PVP.ini MinimumPKRequiredToDrop): they can drop their gear and items.
RedNameKarma = 500

# Each phantom carries a Blessed Scroll of Escape. The Horsemen and the Pker have this chance (percent) to curse you
# out, read it and vanish (counted as defeated) the first time they drop under 10% HP.
RedEscapePercent = 50
# Everyone else (Wimp, Normie, Hard, contested spots) has this chance, and also rolls it once three quarters of their
# group is down and your side outnumbers what is left. 0 = no scroll.
OtherEscapePercent = 25

# Per kind. MinMinutes/MaxMinutes = each kind has its own timer per player: after one of that kind, you wait a
# random time between these (minutes) for the next. 0 turns the kind off. If two are due at once, the rarer
# comes first. MinPlayerLevel = your level at which it unlocks.
# LevelMin/LevelMax = the phantom's level compared with yours (-3 = three under, 6 = six over).
# EnchantMin/EnchantMax = the +level on its weapon and armor.
# AdenaReward = flat adena paid straight to you once, when the whole group is down (0 = none).

WimpMinMinutes = 30
WimpMaxMinutes = 40
WimpMinPlayerLevel = 10
WimpLevelMin = -3
WimpLevelMax = -2
WimpEnchantMin = 0
WimpEnchantMax = 0
WimpAdenaReward = 50000

NormieMinMinutes = 30
NormieMaxMinutes = 40
NormieMinPlayerLevel = 10
NormieLevelMin = 0
NormieLevelMax = 0
NormieEnchantMin = 0
NormieEnchantMax = 3
NormieAdenaReward = 100000

HardMinMinutes = 120
HardMaxMinutes = 180
HardMinPlayerLevel = 20
HardLevelMin = 3
HardLevelMax = 3
HardEnchantMin = 3
HardEnchantMax = 4
HardAdenaReward = 200000

HorsemenMinMinutes = 270
HorsemenMaxMinutes = 330
HorsemenMinPlayerLevel = 20
HorsemenLevelMin = 5
HorsemenLevelMax = 5
HorsemenEnchantMin = 5
HorsemenEnchantMax = 7
HorsemenAdenaReward = 350000

PkerMinMinutes = 420
PkerMaxMinutes = 540
PkerMinPlayerLevel = 20
PkerLevelMin = 11
PkerLevelMax = 11
PkerEnchantMin = 16
PkerEnchantMax = 16
PkerAdenaReward = 1000000

PkPartyMinMinutes = 150
PkPartyMaxMinutes = 210
PkPartyMinPlayerLevel = 20
PkPartyLevelMin = 1
PkPartyLevelMax = 3
PkPartyEnchantMin = 3
PkPartyEnchantMax = 5
PkPartyAdenaReward = 300000

# PveParty only comes from Contested Farming Zones, so its timer stays off (0) unless you want them on a schedule too.
PvePartyMinMinutes = 0
PvePartyMaxMinutes = 0
PvePartyMinPlayerLevel = 20
PvePartyLevelMin = 0
PvePartyLevelMax = 2
PvePartyEnchantMin = 0
PvePartyEnchantMax = 3
PvePartyAdenaReward = 150000

# Contested Farming Zones.
# While you kill monsters in a popular hunting ground, each kill has a small chance to bring a phantom who says the
# spot is theirs. It asks, then fights you once, like a Wimp. Needs Enabled = True above. Off by default.
ContestedZones = False
# Chance per kill, in percent. 2.0 is about one contest per 50 kills, further limited by the cooldown below.
ContestedChancePercent = 2.0
# Minutes before the same player can be contested again.
ContestedCooldownMinutes = 15
# What a contested spot sends: this percent of the time a PvE party that wants the spot, otherwise a PK party.
ContestedPvePercent = 70
# A PvE party asks about the spot first this percent of the time (and attacks if you refuse); otherwise it just attacks.
PveAskPercent = 50

# Test commands (type in game chat). Leave False for normal play.
#   .enc wimp|normie|hard|pkparty|horsemen|pker|pveparty   force that encounter right now (ignores timers and unlock levels)
#   .enc pveparty ask|ambush              force a PvE party that asks first, or one that just attacks
#   .enc contest                          force a contested-spot encounter
#   .enc chance <percent>                 turn contested zones on at that chance, no restart needed
#   .enc buffs [tank]                     give yourself the buff kit phantoms spawn with (works without encounters)
#   .enc reset / .enc status              clear your contest cooldown / show the settings
TestCommands = False

# Fight timing, in seconds.
# How long the phantoms may take to reach you before giving up.
ApproachSeconds = 60
# The longest a fight may last before they leave.
FightSeconds = 240
# Contested spot fights only: seconds after the phantom speaks before it attacks (at once if you hit it first).
WarnSeconds = 7
# Hard: seconds you must stand still before they strike (they also strike at once if you are fighting a monster).
StillSeconds = 4
