# Hunting module
# Master on/off switch. With this False the module does nothing and the server is stock.
# Set it to True and restart to add the Hunting tab to the Community Board (Alt+B).
Enabled = False

# Text on the Community Board navigation button. Chat command: .hunting
TabLabel = Hunting

# Adena rewards on/off. False: contracts still count and can be claimed (so progress is kept), but nothing is paid
# and the reward amounts are hidden in the tab. True: pay the amounts below.
AdenaRewards = True

# Every amount below can be changed: edit the numbers, save, restart the server.
# Extermination Contracts are split into seven grades by the average level of the hunting ground:
# 1-19, 20-39, 40-51, 52-60, 61-75, 76-79, 80+. The three lists below have one number per grade, in that order.

# Kills asked in each ground (once per ground).
GroundKills = 100,250,350,500,600,750,1000

# Adena paid for each ground.
GroundRewards = 100000,250000,500000,1000000,2000000,3000000,5000000

# Section bonus for finishing every ground of a grade (once per grade).
GroundSectionRewards = 1000000,2500000,5000000,10000000,15000000,30000000,40000000

# Bounties (raid bosses): reward = boss level x boss level x this.
RaidAdenaFactor = 400.0

# Clearing every raid boss of a level range pays this share of what that range's bosses paid in total.
# 0.5 = half again. Set 0 for no section bonus.
RaidBandBonus = 0.5

# Grand Bosses (Queen Ant, Core, Orfen, Zaken, Baium, Antharas, Valakas) are a separate list.
# Reward = boss level x boss level x this.
GrandAdenaFactor = 2000.0
