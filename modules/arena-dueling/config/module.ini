# Arena Dueling module
# Master on/off switch. With this False the module does nothing and the server is stock.
# Needs FakePlayers on, PhantomPvpEnabled = True and PhantomPvpDuels = True in config/Custom/FakePlayers.ini, and
# PhantomPvpBetweenPhantoms = True (the default) if you want the regulars to spar with each other.
# Set it to True and restart to turn it on.
Enabled = False

# What this does:
#   - Phantoms ("regulars") hang out at the PvP arenas below while you are in one, and spar with each other.
#   - A little after you walk in, a phantom of YOUR class walks over and challenges you to a duel.
#   - You can call a duel yourself with  .duel <class|any> [stake]   e.g.  .duel titan 50k
#   - Either way you can put adena on it first with  .stake <amount>  (the winner takes it).
# They duel with the server's own duel system: countdown, nobody dies, HP and MP restored at the end.
# The stock rules refuse duels inside a PvP zone. This module opens the arenas below to duels; nowhere else changes.

# The arenas, by zone name (see data/zones/pvp.xml: gludin_pvp, dion_monster_pvp, giran_pvp_battle, colosseum_battle1...).
Arenas = gludin_pvp,dion_monster_pvp,giran_pvp_battle

# Players below this level are left alone.
MinPlayerLevel = 10

# How many regulars stand in an arena while a player is in it.
RegularsPerArena = 3
# The most duelists the module keeps at once, across every arena.
MaxDuelists = 12
# Regulars come within this many levels of the player (up or down).
LevelSpread = 2
# The +level on their weapon and armor.
EnchantMin = 0
EnchantMax = 3
# Seconds after the last player leaves an arena before its regulars go home.
LeaveGraceSeconds = 60

# Sparring: while a player is in the arena, two idle regulars now and then duel each other.
Spar = True
SparMinSeconds = 45
SparMaxSeconds = 90

# Class challenges: this percent of the time, a phantom of the player's class challenges them once ChallengeDelaySeconds
# after they walk in, then no more than once per ChallengeCooldownMinutes (the roll repeats every minute until it hits).
ClassChallengePercent = 70
ChallengeDelaySeconds = 15
ChallengeCooldownMinutes = 10

# Called duels (.duel <class|any> [stake]). A class name has no spaces: titan, phoenixknight, evastemplar.
CallDuels = True
CallCooldownSeconds = 30

# Wagers. Stakes you may choose (adena, "50000" or "50k" both work). The stake is taken from you the moment the phantom
# sets off to duel you, and is locked: .stake off and new stakes are refused until the duel is over.
#   Win:  your stake comes back plus the stake less HouseFeePercent (so a 100k stake at 10% pays +90k).
#   Lose: the stake is gone.
#   Walk away, fight something else, or log out with the phantom still there: you forfeit the stake.
#   Time-out, or the phantom disappeared, or the duel never started: the stake is refunded.
# A stake nobody duelled for lasts StakeExpireSeconds. Wagers=False makes every duel for honor only.
Wagers = True
Stakes = 10000,50000,100000,500000,1000000
StakeExpireSeconds = 180
# The house's cut of what a win pays (0-50).
HouseFeePercent = 10
# The most one player can win in an hour of real time, after fees (0 = no cap). Winnings are new adena, so keep it modest.
MaxWinPerHour = 2000000
