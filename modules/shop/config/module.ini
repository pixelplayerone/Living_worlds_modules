# =============================================================================
#  Shop Front
#
#  Everything on this page is configuration. Nothing needs a code change, and
#  nothing needs a restart to try - well, one restart, because module code is
#  loaded once at boot. After that it is this file and a restart.
#
#  The one thing to read before editing markup is README.md, section
#  "What this HTML engine will not do". Two of the ideas in there will crash a
#  client rather than merely look wrong.
# =============================================================================


#  The on/off switch. false logs a line at boot and registers nothing.
Enabled = true


# -----------------------------------------------------------------------------
#  The catalogue
# -----------------------------------------------------------------------------

#  Every item the shop sells, on one line.
#
#    Items = <itemId>;<note>;<price>|<itemId>;<note>;<price>|...
#
#  Fields, in order:
#
#    itemId   required   a stock item id. The name and the icon are read from
#                         the item itself, so a renamed item needs no edit here.
#    note     optional   one short line under the name. Do not use ; or | in
#                         it - those are the separators. Omit it by leaving the
#                         field empty: "1146;;5000".
#    price    optional   Adena, per unit. Leave it empty or 0 and the row shows
#                         no price at all, which is the right answer for an item
#                         whose price lives somewhere else.
#
#  This ships with TWO EXAMPLE ROWS so there is something to look at and buy on a
#  fresh install, instead of a page you have to already understand to test.
#  Replace the whole line with your own stock. Item 1 is a Short Sword and 1146
#  is a Squire's Shirt - two different item types on purpose, so the page shows
#  two different icons.
#
#  The prices below are round on purpose. They are NOT the items' own prices:
#  a Short Sword's price set is 768 and a Squire's Shirt's is 26. What a shop
#  asks is set here and has nothing to do with that number.
#
#  Ids are real Interlude item ids and are checked against data/stats/items at
#  boot - a bad one is dropped with a warning naming it. Note that 4037 is Coin
#  of Luck, not Soft Leather, which is the sort of thing worth verifying.
#
#  To start from nothing instead, blank this key. An empty Items is valid: the
#  shop opens and explains itself instead of selling anything.
Items = 1;Example row - change the id and this text;1000|1146;The note under the name - keep it to one line;25000

#  How the shop is reached by BYPASS, i.e. from a link in an NPC dialog:
#
#      <button value="OPEN SHOP" action="bypass -h shop" width=100 height=22
#              back=sek.cbui94 fore=sek.cbui92><font color=D7DCE2>Open the shop window</font><br>Then a note
#
#  NOT closed. back/fore unquoted, value quoted so it may contain a space.
#  The <font> after the tag lands BESIDE the button on the same line and fills
#  its width - never put a <br> straight after the tag, or the caption sits
#  alone and the empty half of the button shows as a gap. The break comes after
#  the </font>, as above.
#  See README, "Buttons", for why each of those is required rather than
#  stylistic.
#
#  This is NOT a chat command. Typing .shop in game will never reach this
#  module, for reasons the README explains. The name must not contain a space:
#  the core truncates a bypass at the first space before looking it up.
Command = shop

#  How the shop is opened when the paper is double-clicked. This module ships
#  that paper as item 40000 (see data/items/40000.xml), so this works on the first
#  restart with nothing else to set up.
#
#  Set it to 0 to remove the item route entirely. The NPC dialog link above
#  keeps working either way - the two are independent.
OpenItemId = 40000

#  Hand the paper above to every player: at each login, and to newly created
#  characters, if they do not already hold one. A player who destroys theirs gets
#  another at the next login. Set to false if you give the paper out some other way
#  or want it to be a reward. Has no effect when OpenItemId is 0.
GrantOpenItem = true


# -----------------------------------------------------------------------------
#  The native shop window
# -----------------------------------------------------------------------------

#  The multisell list id, or 0 to run without one.
#
#  The list must be a file named <MultisellId>.xml in data/multisell - the FILE
#  NAME is the id, so renaming the file renames the list. It must contain the
#  <npc>-1</npc> sentinel or the core refuses to open it for anyone who is not a
#  GM. Both of those are explained in full in README, "The multisell list".
#
#  Set this to 0 and the module works perfectly well on its own: the page shows
#  quantity buttons and does the transaction itself. The window is an upgrade,
#  not a dependency.
MultisellId = 950000

#  Set false to keep the page but never offer the window button, even if the
#  list looks healthy. Useful for checking that the fallback path still works
#  after you change something.
UseWindow = true


# -----------------------------------------------------------------------------
#  Page text
# -----------------------------------------------------------------------------

#  These two lines are the shop's whole front. They are deliberately obvious as
#  examples: a fresh install should look deliberate rather than broken, and a
#  reader should be able to tell within one glance that nothing here is final.
#  Replace both when you set the Items key above.
PageTitle = EXAMPLE SHOP
PageIntro = Two example rows. Replace them in config/module.ini.
#  Lines under the button. Keep them to one short sentence that fits on one line
#  of the dialog: a longer one runs out past the edge instead of wrapping, which
#  is what "out of border" looks like. The wording below is the length the
#  working taming page uses.
WindowNote = The shop window takes the quantity and the Adena itself.
FallbackNote = Buy directly below.

#  Shown instead of the fallback note when the multisell list turned out to be
#  unusable and you would rather say why than quietly downgrade. Set to an empty
#  value to stay quiet.
WindowMissingNotice = The shop window is unavailable, so buy directly below.


# -----------------------------------------------------------------------------
#  Layout
# -----------------------------------------------------------------------------

#  Page width in pixels. The rows below are sized to sit inside it; if you make
#  this much narrower the columns will collide.
TableWidth = 430

#  Item icon size. 32 is what the client's own inventory uses and is the value
#  this was tested at. Larger is untested - see README.
IconSize = 32

ShowIcons = true
ShowPrices = true

#  Quantity buttons offered by the direct-buy path. Comma separated.
Quantities = 1,10,100


# -----------------------------------------------------------------------------
#  Colours
#
#  These are <font> colours only, and they are the only colours on the page.
#
#  There is deliberately no background colour setting. bgcolor crashed the
#  client when it was tried, and the coloured-panel idea cannot be reached any
#  other way either - both routes are written up in README, "What this HTML
#  engine will not do". Do not add one back.
# -----------------------------------------------------------------------------

TitleColor = F2CC60
LabelColor = E4E1DB
NoteColor = 6E7681
PriceColor = F2CC60
NoticeColor = F6C453

#  There is deliberately no ButtonTextColor. The caption goes in the button's
#  value attribute and nowhere else, because this engine draws an inner font
#  tag as well and the two captions overlap each other. Core NPC pages have no
#  such key either.