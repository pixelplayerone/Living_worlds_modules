# Beast Collar Taming module
#
# Everything the module reads at startup lives in this file. There is no second
# data file to keep in step: the original build's data/taming/TamingData.xml was
# empty by default and its rules are reproduced by the defaults below.

Enabled = true

# ---------------------------------------------------------------- item ids ---
# 9300 Broken Beast Flute  - reagent for ordinary monsters
# 9301 Ancient Beast Bugle - reagent for raid monsters
# 9302 Tamed Beast Collar   - the control item, created by the module on capture
# Tame gear uses whatever equipment the player already owns, so the module
# defines no gear items of its own.
# All of these must also appear in the items reserve in module.json.
#
# All three are pure data. Nothing in the code names them: the reagents carry
# their own skill and the collar is found through the profile.
NormalTamingItem = 9300
RaidTamingItem = 9301
CollarItemId = 9302

# ------------------------------------------------------- orphaned tame sweep ---
# A tame row can outlive its collar. Two ordinary ways to lose a collar never pass
# through this module: the player throws it away, or the owner deletes the
# character. Nothing here is told when that happens, so the row survives, gets read
# at every boot, and is reported as a restored collar that does not exist. The
# count only grows, and because TameForge seeds its next private npc id from
# MAX(synthetic_npc_id), the orphans also push the id band forward permanently.
#
# At startup the module looks for tamed pets whose collar object id is no longer in
# the items table, and reports what it found.
#
#   report  - find them and log them, delete nothing. THE DEFAULT, on purpose:
#            this removes saved player data, so the first run should be one you
#            read rather than one you trust.
#   true    - find them and delete them, logging each one before it goes.
#   false   - do nothing at all.
#
# What it checks: no row in items carries that collar's object id, or the row that
# is there is a different item entirely (which would mean the object id was reused
# and the tame is a phantom). An unrecognised value is treated as report, so a typo
# can never be the thing that deletes pets.
#
# Deleting keeps the bestiary, which is recorded per owner and per species and is
# not tied to one collar.
#
# It does NOT give the private npc id back. Reusing a released id would change how
# an existing beast is addressed, so a slot is treated as spent once allocated.
OrphanCollarSweep = report

# ------------------------------------------------------------ store catalogue ---
# The store is opened by double-clicking item CatalogueItemId in your bag. The
# player sees it under the borrowed name "Spell Paper", because the client takes
# an item's name from its displayId and AbstractItemPacket sends no name of its
# own.
#
# It is granted rather than sold, because a shop you need an item to buy before
# you can buy anything is a chicken-and-egg problem. The grant is checked by item
# id on every login, so nobody accumulates duplicates; a player who destroys
# theirs gets it back next login.
#
# Set GrantCatalogue = false to stop handing it out. Nothing else depends on it,
# and .tamestore still opens the store either way.
GrantCatalogue = true
CatalogueItemId = 9303

# What the store charges for one reagent.
#
# In the normal case the player buys through the shop window, and the window charges
# the copy of these two numbers that lives in the multisell list. These values here
# charge the page's own quantity buttons, which are drawn only as an automatic
# fallback when the window is not usable - see the note on that further down.
NormalTamingPrice = 10000
RaidTamingPrice = 250000

# The store page opens multisell ReagentMultisellId through its OPEN SHOP button.
# That window is the game's own, so it has the client's quantity selector and the
# core's MultiSellChoose transaction - Adena, weight, capacity and messages are all
# handled by the core. The page itself is only the entrance to it.
#
# The reason the window needed a sentinel to exist at all: MultisellData refuses to
# send a list to an ordinary player unless the list says who may open it, and a
# list with no <npcs> block is refused outright. The core's own test is
# isNpcAllowed(-1) FIRST, and -1 is a literal set entry, so the list ships
# <npcs><npc>-1</npc></npcs>. That makes the list openable by anyone, which is what
# a reagent shop needs, and MultiSellChoose skips the same test the same way so a
# purchase completes and not only the window opening. See data/multisell/9300.xml
# for the full reading of the core bytecode.
#
# This has since been confirmed on a running server: a player with GM status off
# opened the list and bought from it.
ReagentMultisellId = 9300
#
# THE PAGE FALLS BACK AUTOMATICALLY
# TamingData.verifyMultisellPrices reads the list at startup and decides whether the
# window is expected to work: the file must exist, must still carry <npc>-1</npc>,
# and must price every row it recognises in Adena and in agreement with this file.
# That decision is TamingData.isMultisellUsable(), and the store page reads it. If
# the window is usable the page offers only OPEN SHOP. If it is not, the page says
# the window is unavailable and draws the reagents with 1 / 10 / 100 buttons that
# charge NormalTamingPrice and RaidTamingPrice from here. Startup logs which way it
# went and why. So a broken or missing list costs the window, not the store.
#
# PRICE IS HELD TWICE, ON PURPOSE
# The fallback buttons charge NormalTamingPrice and RaidTamingPrice from here. The
# window charges whatever data/multisell/<ReagentMultisellId>.xml says, because
# Adena has to be an ingredient of a multisell row and that file is the only place
# a row can be expressed. Two files holding one price can drift, so
# TamingData.verifyMultisellPrices reads that XML at startup and logs a warning
# naming the row if the two disagree. A price changed in one file and not the other
# is then reported at boot instead of quietly selling at the cheaper amount.
#
# Two consequences of the same split:
#   - A reagent id changed here must also change the matching <production> id in
#     the list. The same startup check reports a row whose production is missing.
#   - ReagentMultisellId is a module-owned list id and must not collide with another
#     list. The framework does not reserve multisell ids (it only checks items,
#     skills and npcs against the base game), so nothing enforces that but this file.

# The store is reached by double-clicking the catalogue item, or with .tamestore,
# a voiced command any player can use. It is NOT reached from a Pet Manager: the
# module framework registers an html resource root but HtmCache never reads it, so
# a module dialogue file is never served, and there is no hook for an NPC being
# talked to. See the header of TameReagentShop.java.

# ------------------------------------------------------------------- skills ---
# PlayerDamageSkills gives every tame one real player damage technique as its
# signature move, on top of the techniques it inherits from its own species.
#
# This is the same pool the SKILL VISUALS page lists - the 95 active player
# damage skills - used for a different purpose. Nothing here is hand-picked: all
# 95 were checked for the two things that make a player skill unusable on a
# dynamic Pet, a <condition> it could never satisfy and a weapon requirement,
# and this datapack has no condition tags anywhere and none of the 95 mention a
# weapon, so all 95 are safe.
#
# The technique is picked per individual from a seed derived from the beast, so
# two wolves of the same role keep the same technique for life rather than
# rerolling on every summon, and it follows the role: an ARCHER gets physical
# ranged, a MAGE or SUPPORT gets magic, anything else gets physical. Bosses are
# held to the same no-AOE, no-suicide, power-cap rules as their inherited
# techniques.
#
# Species identity is kept, not replaced - the beast's own inherited techniques
# still fill its other slots, it simply fights with one borrowed player technique
# as well.
#
# Because a deck is written once at capture, a beast forged before this existed
# would keep its old signature forever, so the signature is checked on every
# summon and rewritten only when the rule actually names a different technique.
# That is idempotent, it touches exactly one row, and it never disturbs an
# awakened beast's chosen path - so existing tames pick this up just by being
# called out again.
#
# Set false to go back to purely inherited techniques.
PlayerDamageSkills = true

# How far a tame's SIGNATURE technique reaches. This is the setting behind "my pet's
# skills do not reach".
#
# Reach cannot be widened on a skill that already exists. SkillData hands out ONE shared
# instance per id, so raising castRange on it would change every creature in the game that
# uses that technique - and a private rebuilt copy is not an option either, because the
# rebuild TameSkillAura uses works precisely because a directly constructed Skill has an
# empty effect list, and a signature technique has to keep its effects. So the lever is
# WHICH technique gets granted, not how far it can throw.
#
# SignatureMinRange is the floor: a technique shorter than this is not eligible for the
# signature slot at all. 900 is the stock bow range and about the floor where a technique
# stops being a melee swipe. 0 disables the floor and restores accepting whatever the pool
# offers.
#
# If the floor empties a species' pool, the signature keeps the old reach rather than being
# dropped - a tame that silently loses its signature is worse than one with a short-range
# one - and the log says so. Lower this if you see that warning for a species you expected
# to be long-range.
#
# SignatureReachBand is how many of the longest-reaching survivors stay in the running.
# Taking only the single longest would hand every archer in the game the same technique;
# taking everything would leave the complaint exactly where it starts. The band biases the
# roll towards distance while letting two beasts of the same role come out different.
#
# Only affects the SIGNATURE slot. Inherited techniques are left alone - they belong to the
# species, and rewording them would be a different kind of change.
SignatureMinRange = 900
SignatureReachBand = 12

# 9300 Beast Binding  - the capture skill
# 9301 Pet Power Strike
# 9303 Beast Recall   - brings the beast back out of its collar
#
# Recall is a granted skill again, used from the skill window. It spent a
# revision as a Recall Crystal item, which is gone: an item destroyed on every
# use has to be replaced after every recall, and the skill it carried was free.
#
# It still cannot be a shortcut bar button, and that is not fixable from here.
# A bar button is drawn by the client out of its own data keyed by id, so a
# module id has no icon on it; ShortcutRegister sends only type, slot, page, id
# and level, and no packet anywhere sends skill templates to the client. The
# skill window is a different surface - the server sends the id in SkillList,
# so the client lists it and it can be cast from there.
#
# TamingSkillId and RecallSkillId are the module's OWN ids. They work when cast
# by id, and the collar window calls the same code directly.
#
# TamingTriggerSkillId and RecallTriggerSkillId are stock skill ids the client
# already knows, with this module's handler attached in place of their normal
# behaviour. The button shows the STOCK skill's real name and icon, not
# "Beast Binding" - there is no way around that, it is how a client-drawn button
# gets its label. Both are 0: recall is the granted skill, and capture has its
# reagents.
#
# Capture has no trigger: TamingTriggerSkillId = 0. The flute and bugle put the
# capture skill on the reagent itself, which is the better fit anyway - you cast
# the reagent rather than carrying a permanent skill, and the two reagents stay
# distinguishable. The id this used to borrow, 4549, is released.
#
#   4549  "Quest - Unsealed Altar"   -> capture, retired
#   7000  "NPC Default"               -> recall, retired
#
# Neither borrowed id is granted any more, and a character who tested before
# this will have one revoked on their next login - see TameLegacyShortcutGrant.
# Both were checked against every class skill tree in this build and neither is
# granted by any class, so no character loses a real skill or has one hijacked
# out from under it.
#
# Set a trigger to 0 to give up that button and fall back to the module's own id.
TamingSkillId = 9300
TamingSkillLevel = 1
RecallSkillId = 9303
RecallSkillLevel = 1
TamingTriggerSkillId = 0
RecallTriggerSkillId = 0

# Grants the recall skill to the character on login and on creation, so it is in
# the skill window and can be cast from there.
#
# It cannot be a shortcut bar button and never will be: the client draws a bar
# button from its own data keyed by id, and no packet can send artwork. The skill
# window is a different surface, because the server sends the id in SkillList.
#
# Note that granting it puts an entry in the client's skill window for an id it
# has no artwork for, which draws as a black square. That is the trade: a skill
# you can actually press, in exchange for one blank icon next to it. It is also
# why 9303 has to be in the keep set in TamingModule - it is on the legacy
# revocation list, and without protection the sweep takes the grant straight back
# off again on every login.
GrantRecallSkill = true

# Grants the capture skill instead. Off on purpose: capture comes from the flute
# and the bugle, which carry their own skill, so a granted one would only be a
# second way to do the same thing plus another black square. Turn this on only if
# you want to capture without spending a reagent.
GrantTamingSkill = false

# ------------------------------------------------------- capture difficulty ---
# The two tiers do not roll the same way, and the difference is deliberate.
#
# Ordinary creatures are a FLAT roll. NormalChanceCap is the chance, full stop: no wounded
# bonus raises it and no level gap lowers it, so the number below is the number that
# happens. Both ends are still clamped to [0, NormalChanceCap] so a per-species
# BaseChance override cannot exceed it.
NormalChance = 10.0
NormalChanceCap = 10.0
#
# Raids keep the modifiers - weaken one first, and it outlevelling you should both count
# against a boss - but they stop at RaidChanceCap, so a nearly-dead raid is easier than a
# fresh one and can never climb past 1%.
RaidChance = 0.5
RaidChanceCap = 1.0
#
# A wounded raid is easier to take: each missing percent of health adds this much times
# WoundedHpWeight to the chance. RAIDS ONLY - ordinary creatures ignore it entirely.
WoundedHpWeight = 0.4
# Each level a raid is above the player subtracts this much from the chance.
# RAIDS ONLY - ordinary creatures ignore it entirely.
#
# Note the edge this puts at 0.5% base: a raid at or below your level rolls 0.5-1%, but one
# level above computes 0.5 - 2.0 and clamps to 0, which is flatly impossible rather than
# rare. That is the honest reading of "a raid above your level is out of reach", but it is
# a step rather than a slope. Raise RaidChance or drop LevelGapPenalty if you want raids
# merely rare instead.
LevelGapPenalty = 2.0
# The floor for the raid roll, so a level gap cannot drive an attempt negative. 0 means
# genuinely impossible.
#
# This was hardcoded to 1, which quietly broke the range: a raid configured below 1% was
# silently raised back to 1% before the roll, and a raid many levels above still had 1% to
# sit on. Ordinary creatures do not use this.
ChanceFloor = 0.0
# SUPERSEDED - kept only so an old config does not fail to parse. The roll is clamped per
# tier now (NormalChanceCap / RaidChanceCap), so this value is read and never applied.
ChanceCap = 95.0

# ------------------------------------------------------------- level ceiling ---
# The tame's own maximum is rolled once per collar as source level + this, then
# bounded by LevelCap. Two tames of the same creature can end up with different
# maximum levels.
LevelBonus = 5
LevelCap = 80

# -------------------------------------------------- per-species rule changes ---
# Comma separated NPC ids. Each one needs a matching section below, for example:
#
#   OverrideIds = 25044, 25070
#
#   [Override.25044]
#   Tier = RAID
#   BaseChance = 10.0
#   RequiredItem = 9301
#   MaxPetLevel = 25
OverrideIds =

# ------------------------------------------------------------ pet behaviour ---
# How many seconds a dead tamed pet's corpse stays before it decays away. The
# original build offered a 20-minute window to revive, so the pet is not lost by
# default. During the window Beast Recall / a resurrection brings it back.
PetCorpseTime = 1200

# ------------------------------------------------------------------- wounds ---
# A tamed beast that dies comes back wounded, and a wounded beast cannot be
# summoned. Reviving it is stock L2 and costs only a Resurrection Scroll, Bead or
# Phoenix Bead; bond plays no part in that.
#
# Wounds are a severity from 1 to 5 and there are two ways to close them:
#
#   .tamefeed N   free and slow. Each piece of Food for Wolves takes off one step,
#                 so a beast hurt badly needs five. Feeding works on the collar
#                 directly, so a wounded beast can be nursed while it is unable
#                 to be summoned.
#   .tameheal     instant, and costs 500 bond.
#
# The stat penalty scales with the severity, up to eight percent while a beast is
# at the worst of it. Feed to close wounds, then feed to build the bond back.

# ----------------------------------------------------------------- hand gear ---
# A summon's weapon is drawn from the pet's own inventory, not from its NPC
# template (the HandsDebug log shows "template=X pet.getWeapon()=0" when only the
# template has it, and nothing is drawn).
#
# ShowWildWeapon puts the weapon the creature's wild species carried into the
# tame's weapon slot before it spawns, so a tame whose species held a weapon is
# drawn holding it. It always uses the species' OWN weapon, because the model has
# animations for that weapon type. A creature that never carried a weapon is
# left empty-handed: forcing one on makes it slide while walking and freeze while
# attacking. A weapon installed on a collar affects stats only, not the look.
ShowWildWeapon = true

# PetRightHandItem, PetLeftHandItem and PetWeaponEnchant are an optional default
# written onto EVERY tame's template. They do not draw a weapon on their own (see
# above), so leave them at 0.
PetRightHandItem = 0
PetLeftHandItem = 0
PetWeaponEnchant = 0

# Writes one line to the server log every time a tame is summoned, with the
# weapon its wild species carried, what its template holds now, and what the pet
# reports. Turn this on when a weapon is not drawing, to see where it is lost.
# Left off: the weapon draws correctly now, and leaving it on puts four lines per
# summon into the log forever.
HandsDebug = false

# Writes one line to the server log for every experience grant the module makes,
# naming the tame and the creature it killed. Turn this on when the tame's
# experience looks wrong: the usual causes (tame dead, tame out of range, the
# kill credited to someone else's pet) are otherwise invisible in game.
# Left off: the split is correct, and leaving it on puts a line in the log for
# every kill any tame makes.
ExperienceShareDebug = false

# ----------------------------------------------------------------- auto-cast ---
# This is the tame's casting surface. A tame uses its own techniques by itself,
# so the player never presses anything to fight. There is no manual USE button on
# the collar page any more: it duplicated this decision with a worse one, firing
# at whatever the player had selected instead of what the beast was fighting.
#
# The shortcut bar this replaced was removed on purpose. A shortcut button is
# drawn from client data and cast by the player, which forces the id to be a real
# stock skill and puts an unexplained skill in the character's own list. The
# client's own pet skill bar is still bound on every summon and still needs no
# client change, but it cannot resolve a skill for a synthetic npc id, so in
# practice auto-cast is what makes the techniques fire.
#
# AutoCast enables the server-side caster that makes a tame use its deck, since
# the client's pet bar cannot resolve the synthetic skill ids.
#
# AutoCastIntervalMs is how often the server looks for a tame worth casting with.
# AutoCastMinGapMs is the shortest time allowed between two casts by the same
# tame, which is what stops a buff being reapplied every second.
# AutoCastSkillCooldownMs is the shortest time before the SAME technique may be
# used again by the same tame. Beast skills carry no reuse delay, so without this
# a tame with plenty of MP leans on one skill and repeats it; this makes it work
# through its deck instead. Healing is exempt, so an emergency heal is never held
# back by the rotation.
# AutoCastMeleeFirst makes an offensive technique wait until the beast has stopped
# at its target, so it closes and fights instead of casting while walking (which
# looks like a stutter). Turn off for a beast meant to fight at range.
# AutoCastHealPercent is the ally-health percent at or below which a healing
# technique is worth a cast. The beast heals whichever of itself and its owner
# is hurt worse; above this it saves the cast for damage or a debuff.
AutoCast = true
AutoCastIntervalMs = 1000
AutoCastMinGapMs = 2000
AutoCastSkillCooldownMs = 5000
AutoCastMeleeFirst = true
AutoCastHealPercent = 70

# ------------------------------------------------------------------ balance ---
# PetGrowthCeiling is the single most important number on this page for how the game
# feels, and it exists because the growth term is a power of the beast's level.
#
# A tame's stats are the wild mob's own stats, multiplied by this module's factor stack,
# multiplied by (1 + growthPercent)^(level - 1). growthPercent is rolled per individual
# between 1.25 and 8.00 percent. Left uncapped that is:
#
#   level   1.25%/lvl    5%/lvl    8%/lvl
#      20        1.3x       2.5x      4.3x
#      62        2.1x      19.6x    109.4x
#      80        2.7x      47.2x    437.0x
#
# Two multipliers were scaling together - the tier of whatever the beast ate, and its
# level - and multiplying. A raid-boss tame at level 80 reached 218x a raid boss's own
# PAtk, which is why raid and high-level tames were absurd while weak ones were fine:
# a wolf at 437x is still a wolf. That asymmetry is the whole bug.
#
# This caps the RESULT rather than the rate, so each beast keeps its own curve and its
# growth roll still matters; only the top is bounded. At 3.0 a raid tame is about 0.70x
# the raw raid boss's own stats (3.0 x the 0.2333 RAID/BOSS coefficient below) - still a
# serious threat at a raid creature's own level, but no longer stronger than the raid it
# was taken from.
#
# The honest cost of capping the result: a beast that rolled the maximum growth is fully
# grown by about level 15, while the minimum roll never reaches the ceiling and is still
# climbing at the level cap. So "high level" stops being a power spike, and what
# separates one tame from another becomes the factors that are individually bounded and
# meant to be - potentials, temperament, affinity, imprint, equipment, awakening.
#
# Raise it if you want level to matter longer; lower it toward 2.0 if players still feel
# outclassed by a well-bred tame. Anything outside 1.0..20.0 is refused and logged.
#
# At 3.0 a raid tame is about 0.70x the raw raid boss's own stats (3.0 x the 0.2333
# RAID/BOSS coefficient below) - still the deadliest thing on the field, but not a raid
# boss with extra steps.
#
# The stat table is rebuilt from stored base values on every summon, so changing this
# reaches beasts that already exist - they pick it up the next time they are called out.
# No migration, and nothing in the collar data is touched.
PetGrowthCeiling = 3.0

# ------------------------------------------------- absolute stat ceilings (4 of 2) ---
# The five settings below bound a tame's finished stats in absolute points. They exist
# because PetGrowthCeiling bounds a MULTIPLE, and that is only enough when the number it
# multiplies is ordinary. It is not enough when the base is not: a raid boss begins an
# order of magnitude above a normal mob, so 3x that base is still a value the game cannot
# answer. For HP that is a boss nobody can kill; for PAtk it is a boss that deletes a
# character in one hit.
#
# The asymmetry that made runaway stats a bug in the first place was never really about the
# multiplier. It was that a wolf at 437x is still a wolf while a raid boss at 3x is not. So
# the multiple keeps its job of deciding the SHAPE of a beast's progression, and these
# decide where each individual stat stops. They are applied after growth and after
# conversion, at the last point before the number reaches the client.
#
# Every one of these is a CEILING and not a TARGET. A wolf's few hundred HP and its
# hundred-odd PAtk never reach any of them, so weak and mid creatures are bit-identical to
# before and only the genuinely broken high end is held down. A tame of a mid-boss can sit
# exactly on one of these numbers, which is normal and not a sign the cap is too low.
#
# Each one is independent: 0 turns off that single cap without touching the others, and a
# value outside 1..1000000 is refused and logged at boot rather than clamped. A typo that
# silently became 1000 would remove content from the game, and one that became 200000 would
# leave the original problem in place while looking like it had been fixed.
#
# Applied when the stat table is rebuilt, which happens on every summon, so existing beasts
# pick these up the next time they are called out. No migration.
#
# PetHpCap - 30000 is roughly where a well-built high-end tame sits. Raise it if raid tames
# feel too fragile, lower it toward 20000 if they still outlast a whole party.
PetHpCap = 30000
# PetPAtkCap - 22000 is above a well-rolled high-end tame and below anything a boss species
# can reach at full growth. Raise it if tames feel toothless against raid armour.
PetPAtkCap = 22000
# PetMAtkCap - the same number as physical, deliberately, so a caster species and a fighter
# species of the same build are not secretly different power.
PetMAtkCap = 22000
# PetPDefCap - 3000 covers a raid tames worth of mitigation without letting it trivialise
# the physical attacks that are supposed to matter.
PetPDefCap = 3000
# PetMDefCap - the same number as physical, for the same reason.
PetMDefCap = 3000

# --------------------------------------- template stat ceilings, and DEX for the two ---
# These six bound the stats a tame does NOT get from its own stat table.
#
# Crit rate, attack speed, cast speed and movement speed are inherited from the NPC template
# the tame is forged onto, and that template is a copy of whatever wild creature was eaten.
# So a tame of a boss species starts from the boss's own crit rate and the boss's own
# speeds, and no amount of this module's growth touches any of them. That is why they need
# bounding separately rather than being covered by PetGrowthCeiling.
#
# Same contract as the five above: a ceiling and not a target, 0 disables that one cap, and
# anything outside 1..1000000 is refused and logged rather than clamped. These are applied
# when a tame is forged, so existing beasts pick them up the next time they are called out.
#
# PetCritRateCap - 450. Crit rate is in the template's own units, already a percentage.
# Ordinary creatures are nowhere near this; boss species can be several times it.
PetCritRateCap = 450
# PetMoveSpeedCap - 200. Also caps walk, swim and fly speed, all to this same figure, so no
# movement mode can be the one that breaks the ceiling. Lower it toward 120 if tames are
# outrunning everything they should be chasing.
PetMoveSpeedCap = 200
# PetPAtkSpeedCap - 950. Attack speed is how fast a basic attack comes out, so this is a
# damage-per-second control as much as an animation one.
PetPAtkSpeedCap = 950
# PetCastSpeedCap - 300. The magic equivalent of the above. Held down deliberately:
# several mobs are pure mages and a cap above their own cast speed would put a beast
# ahead of every caster it is fighting, which shows up first as an animation that is
# simply too quick to read. 300 sits just under that.
PetCastSpeedCap = 300
# PetAccuracyCap and PetEvasionCap bound accuracy and evasion. These two are the awkward
# pair, and the reasoning matters if you touch them.
#
# Neither has a template key of its own. The core computes both from the creature's level
# and DEX, in the core's own formula functions:
#
#   evasion  = level + 6*sqrt(DEX) + (level - 67)   [above level 69]
#   accuracy = level + 6*sqrt(DEX) + (level - 76) + (level - 69)
#                                                      [above 77 and above 69]
#
# DEX is the only input either takes beyond level, and DEX does come from the template, so
# the module writes a DEX ceiling instead of an accuracy or evasion number. That ceiling is
# DERIVED from these two settings and from this server's own pet level cap, at every tame.
#
# Derived rather than configured on purpose: both formulas climb with level, so the DEX that
# produces a given accuracy depends entirely on how high a tame can get. A fixed DEX number
# would be a silent balance bug the moment the level cap moved, and nothing about the number
# itself would reveal it - it would just quietly stop working. Raising the level cap is
# therefore safe here; a hardcoded value would not have been.
#
# Evasion is usually the binding constraint, because its level extras are larger than
# accuracy's at the same level. With the defaults on a server capped at pet level 80 that
# works out at DEX 38, giving evasion exactly 130 and accuracy 132. Both are solved rather
# than assuming evasion wins, so a config with generous accuracy and tight evasion still
# follows the tighter one.
#
# One caveat worth knowing: a ceiling LOW enough that the level cap alone already exceeds it
# cannot be met by any DEX value, so the module leaves DEX alone rather than writing a bogus
# number. If you set one of these below roughly (pet level cap + its level extras) it will
# have no effect and the log will not say so - that is the one silent case here.
#
# The level cap this is derived against is read from experience.xml, and the core stores that
# value one higher than the level it names, so an attribute of maxPetLevel="80" is subtracted
# back down to 80 before the arithmetic runs. There is no need to compensate for that here.
#
# 0 turns off the bound on that stat independently.
PetAccuracyCap = 180
PetEvasionCap = 130

# ------------------------------------------------------------------- visuals ---
# TameVisual puts an aura on the beast itself, from its affinity, and a second one
# on it once it has awakened.
#
# This is a server-side bitmask that the core sends to the client, so it is a real
# visible change and needs no client patch. It is the only route to a per-beast
# look that exists: the client's NPC name colour is not a server value, because the
# name is sent to the client as a plain string, so a beast's name cannot be
# recoloured from here.
#
# Turn this off if a particular creature model draws badly under the effect. The
# effect each affinity uses is named below and is a change plus a restart, not a
# recompile.
#
# Two things this has already taught us, both found by looking at the running
# client, which is the only way to find them:
#
#   - Effects drawn as a shape in the WORLD stay where they were cast. A beast that
#     walks two steps away leaves its aura behind. MAGIC_SQUARE did this as HOLY, a
#     large circle pinned to the spot the beast was standing on. Effects drawn on the
#     creature follow it.
#   - Some effects draw nothing at all on an arbitrary beast model. FROZEN_PILLAR did
#     this as EARTH.
#
# So the defaults below are all effects known to follow the creature, because
# DOT_FIRE_AREA, DOT_SOIL, SEIZURE1 and SEIZURE2 were confirmed live. Every other
# name here is still a guess until someone looks at it: an enum name says which
# skill data uses an effect, not what it draws on an arbitrary beast model. The
# list of names already ruled out by looking is kept with the values below.
# Any name in AbnormalVisualEffect is accepted; a name that is not real is logged
# and the default is kept, and NONE means that affinity deliberately has no aura.
#
# DO NOT TRUST THE DOT FAMILY FOR A STEADY AURA
# DOT_BLEEDING, DOT_POISON, DOT_FIRE, DOT_WATER, DOT_WIND, DOT_SOIL and
# DOT_FIRE_AREA are all damage-over-time visuals, and a DoT visual pulses - it
# blinks on and off on the tick that drives the damage. DOT_FIRE_AREA as FIRE was
# reported as a flamethrower that appears, disappears and appears again. That is
# the effect working as designed, not a misconfiguration, so it cannot be tuned
# away from here: pick something outside the DOT_ family if you want a steady
# glow. EARTH currently uses DOT_SOIL and is in the same family, so expect it to
# pulse too.
#
# .tameaura <NAME> auditions any of the 57 AbnormalVisualEffect values on your own
# beast without a reboot, which is far quicker than editing this file and rebooting
# once per candidate. Use it to settle a choice, then write the winner below.
# .tameaura with no argument prints the current state and the shortlist.
TameVisual = true

# ROOT rather than the earlier NONE. The fire affinity carries a rooted visual now:
# it reads as a hold on the beast rather than a burn on the ground, and ROOT is one of
# the few effects confirmed to follow the creature instead of drawing a shape the beast
# walks away from. Set to NONE to take the aura back off, or name another value in the
# AbnormalVisualEffect enum; an unknown name falls back to the code default and logs.
AffinityEffectFire = ROOT
AffinityEffectEarth = DOT_SOIL
AffinityEffectWater = SEIZURE1
# SEIZURE2 - the sibling of the one WATER uses, so the two read as the same family
# without being identical. It is outside the DOT_ family, so unlike EARTH it should hold
# steady rather than pulse. Not confirmed on screen; audition with .tameaura SEIZURE2.
AffinityEffectWind = SEIZURE2

# Holy wears DANCE_ROOT. It was NONE because the previous candidate, INVINCIBILITY, drew
# nothing at all on screen - the enum records which effect a skill uses, not that it
# renders on a given creature model, and that is only knowable with the client up. DANCE_ROOT
# is a body-rooted effect rather than a ground-anchored one, so it should travel with the
# beast, but that is the same untested reasoning that already failed once: audition it with
# .tameaura DANCE_ROOT and write the winner here.
#
# The skill cast (AffinitySkillHoly below) used to be a separate layer; it is retired for
# now, so this bitmask is the whole holy look.
AffinityEffectHoly = DANCE_ROOT

# Dark wears DOT_POISON. The skill-cast auras are retired below (every AffinitySkill* is
# NONE), so the bitmask is now the whole look for every affinity, and dark is back on the
# poison dot. It is a DOT_ effect, so it pulses on the damage-over-time tick rather than
# holding a steady glow - that is the effect working, not a misconfiguration.
AffinityEffectDark = DOT_POISON

# Follow re-anchors the aura onto the beast as it walks.
#
# The visual effects ride out in the summon info packet as a bitmask. The client draws
# the ground-anchored ones - GHOST_STUN's circle among them - at the coordinates the
# creature was standing when the bit arrived, so the beast walks off and the picture
# stays behind. That is the pinned-to-the-ground behaviour seen on every attempt.
#
# Setting the same bit again does NOT move it. The core compares the mask before and
# after and skips the packet outright when nothing changed, so a fast re-apply loop
# provably does nothing no matter how fast it runs. The only thing that works is
# clearing the bit and setting it again, which makes the client tear the old picture
# down and build a new one where the creature is standing now.
#
# So this costs two packets to every player who can see the beast, per tick. It is off
# by default, and the interval is floored: below roughly 150ms the rebuild lands on top
# of the last one often enough that the effect visibly stutters. There is no rate that
# makes this free - it is the point where it stops getting worse, not a clean fix.
#
# List the affinities to follow, comma separated. Empty disables it.
AffinityFollow = FIRE
AffinityFollowMs = 150

# Self-heal: put an aura back if something clears it. On by default.
#
# Read the wording carefully, because "nothing can cancel them" is not achievable and
# this is the nearest thing that is:
#
#   A cleared aura is BACK within one interval (AffinityPermanentMs). It is not immune
#   in the meantime. The mask is a plain OR of bits with no owner recorded against
#   them, so stopAbnormalVisualEffect clears a bit no matter who set it, and there is
#   no flag on that call to say "not this one". A real skill that draws the same effect
#   takes the aura off when it ends - SEIZURE1 and ROOT both appear in live skill data -
#   and nothing in this module can veto it.
#
# What it does buy: a dispel, a death, a skill expiring or a server restart cannot leave
# a beast permanently without its aura. The aura comes back on its own.
#
# The poll is cheap when nothing has happened - it asks hasAbnormalVisualEffect, the bit
# is still there, and the core's dirty check means no packet is built. It reads one
# profile per player per tick, which is why the interval is not shorter.
AffinityPermanent = true
AffinityPermanentMs = 1000

# The second route: have the beast cast a skill on a timer, for affinities where the
# bitmask above cannot carry the look.
#
# Why this exists at all: the effect list is fixed, so when none of the sixty-odd values
# reads correctly for an affinity there is nothing left to configure. INVINCIBILITY was
# configured for holy and rendered nothing. A skill, by contrast, is not a guess - the
# client ships the animation for it, so casting it draws exactly what it always draws.
#
# "No stats granted" is not approximated here. The skill used is rebuilt from scratch
# with the real id and level (which is what the client keys its animation off) and with:
#
#   - no effects at all. Skill's effect lists are built empty by its constructor and only
#     ever filled in by the XML loader afterwards, so a Skill built directly has none by
#     construction. There is nothing to strip and nothing that can be forgotten. This is
#     what stops 1157 handing out mana on a loop.
#   - zero MP, HP and item cost. A loop that costs anything empties the beast's bar and
#     then quietly stops, which looks exactly like the feature not working.
#   - zero hit time, so the core launches it instantly. The beast never enters a cast,
#     never shows a bar and never stands still: it looks like it is casting constantly
#     while never actually casting.
#   - zero reuse delay, so the gap below is the only thing setting the pace.
#
# Both of the defaults below are cosmetic-only as a result.
#
# If a beast ever fails to build its aura and logs "could not build a visual-only copy",
# that is the rebuild rejecting a key rather than the skill being wrong. Two of the sixty
# keys are not the plain numbers they look like, and both were found by building against
# the shipped jar rather than by restarting the server to be told:
#   - six keys are enums and want a constant name, never "0": operateType, trait,
#     abnormalType, targetType, basicProperty, abnormalVisualEffect.
#   - affectLimit is split on "-" and parsed on both halves, so it wants "0-0". It is
#     left out entirely instead, because the constructor's field is already a zero-filled
#     int[2] and absence gives the same answer without the trap.
# MODLOG.md has the full account under "Affinity skill auras".
#
# Each tick is a real packet to everyone who can see the beast, so this is not free the
# way the self-heal is. The gap is floored at 1000ms, and a tick is skipped whenever the
# beast is mid-cast of something real, so the cosmetic yields to the fight rather than
# interleaving with it.
#
# NONE, or an empty value, gives that affinity no skill aura.
#
# WIND and HOLY are bound to two weapon skills on purpose. They are attack skills that
# were picked purely for how they LOOK, and they are drawn on the pet as a pure effect:
#
#    19 Double Shot   isMagic absent -> 0   ONE   hit 3000
#     7 Sonic Storm   isMagic absent -> 0   ONE   hit 1900
#
# Neither is a cosmetic in the skill-data sense - both are real damage skills. That does
# not matter here, because the rebuild drops every effect (a directly-built Skill has an
# empty effect list by construction) and forces the costs to zero, so what reaches the
# client is the animation and nothing else. Neither consumes MP, nothing lands, and
# neither puts a gesture on the pet - see AffinitySilentMagic below, which is what makes
# that last part true.
#
# The gap is AffinitySkillMs, not these skills' own reuse delays, so the loop stays even.
#
# Either id can be auditioned in one click before being trusted to a restart:
#   .tameaura -> skill visuals -> search the name -> any skill can be played as a visual
# The config only ever holds a number, and a number says nothing about what it looks like.
#
#   5185 Production: Magic-type Guard  isMagic=false  target=ONE   hit 4000
#   1101 Blaze Quake                  isMagic=TRUE   target=AURA  hit 4000
#    396 Heroic Berserker              isMagic=false  target=SELF  hit 1000
#    453 Escape Shackle                isMagic=false  target=SELF  hit 4000
#   1157 Body To Mind                 isMagic=TRUE   target=SELF  hit 4000
#
# Every one of these gestures on the pet when AffinitySilentMagic is false, magic-type or
# not - that switch is what decides it, not the skill's type.
#
# SOUND: none of these can be made silent from here, and it is not an oversight. The server
# has no concept of skill sound at all - Skill has no sound field or accessor, and the only
# sound packet in the entire server is PlaySound, which ADDS a sound. There is nothing to
# mute with. Whether a skill is audible is decided by the client's own tables, so a loud
# skill stays loud and a silent one stays silent. If the noise is the problem, the client's
# own volume sliders are the only real lever - it is a client setting, not module code.
#
# Any id works, silent or not, so the catalogue is the limit rather than the sound.
# EVERY ONE IS NONE FOR NOW. The skill-cast auras are retired until the animation glitches
# are fixed, so every affinity draws from its bitmask effect above and nothing casts. The
# values that were bound are kept in the block below in case any of them is wanted back;
# set an id to restore that affinity's cast.
AffinitySkillFire = NONE
AffinitySkillEarth = NONE
AffinitySkillWater = NONE
AffinitySkillWind = NONE
AffinitySkillHoly = NONE
AffinitySkillDark = NONE
AffinitySkillMs = 4000

# RETIRED BINDINGS (were in use before the fallback): Fire 3631 Void Flow, Wind 19 Double
# Shot, Holy 7 Sonic Storm, Dark 3091 Item Skill: Poison. Nothing casts these now, so they
# are recorded here rather than left as live values.

# What is bound:
#
#  3631 Void Flow                isMagic absent  ONE   hit 1900
#    19 Double Shot              isMagic absent  ONE   hit 3000
#     7 Sonic Storm              isMagic absent  ONE   hit 1900
#  3091 Item Skill: Poison       isMagic absent  ONE   hit 0
#
# Poison is the same skill the dark awakened proc uses (see TameAwakenedProc), so dark
# wears its own proc as a look. It is a pure stat proc and is applied with effects
# stripped, so nothing here changes what the proc does - it only draws it.

# Stops the pet gesturing at you. TRUE sends MagicSkillLaunched only: it says "this skill
# landed on these targets", so the client plays the skill's effect animation and there is
# no cast to begin, therefore no casting animation. FALSE puts every affinity back on the
# normal useMagic path, which broadcasts MagicSkillUse and does gesture.
#
# This used to be gated on the skill being magic-type, on the belief that the gesture came
# from the skill's type. It does not - it comes from the packet. So the gate left exactly
# the wrong affinities busy: holy on Escape Shackle (453) carries no isMagic at all, and
# neither do Double Shot (19) nor Sonic Storm (7), so all three looped the gesturing path
# and a tame read as permanently busy rather than calm. The gate was conservatism, not a
# limit, and it was the only thing stopping the quiet packet from being used where it
# works. TRUE now covers every affinity.
#
# This is also why setting isMagic to false server-side was never a fix: the client
# judges from its OWN copy of the skill data, so the flag has to be kept off the wire
# entirely - which is what not sending a cast at all does.
AffinitySilentMagic = true

# If one of these still does not look right, change it and restart. It is a line
# edit and a reboot, not a recompile, which is the only reason these are here.
#
# Ruled out by looking at a live client, so do not put them back:
#   MP_SHIELD     as HOLY - reported as drawing nothing on a beast model
#   INVINCIBILITY as HOLY - CONFIRMED. This is the Set Hero glow, a holy aura around
#     the caster. Set Hero is skill 395/396 and its own XML says
#     <abnormalVisualEffect>INVINCIBILITY</abnormalVisualEffect>, so the bench value and
#     the skill are the same visual - casting Set Hero was only ever a slow way to set
#     the bit. Chosen.
#   MAGIC_SQUARE  as HOLY - a large circle pinned to the spot the beast stood in,
#                           which the beast then walked out of
#   GHOST_STUN    as HOLY - same problem
#   FROZEN_PILLAR as EARTH - drew nothing at all
#   ULTIMATE_DEFENCE as HOLY - drew nothing at all, which is why holy looked
#                           missing rather than wrong
#   DOT_BLEEDING  as DARK - rendered as the beast bleeding, so dark read as a
#                           wound rather than a curse
#
# DARK is no longer SPEED_DOWN. SPEED_DOWN was tried for dark and reported as drawing
# nothing on a beast model; dark is on DOT_POISON now (see AffinityEffectDark).
#
# What is known to work is the family that follows the creature: DOT_FIRE_AREA,
# DOT_SOIL, SEIZURE1 and SEIZURE2 were all confirmed live. If a replacement also
# turns out to be pinned to the ground, pick from that family instead - but
# remember the whole DOT_ family pulses, so the steadiest options are SEIZURE1
# and SEIZURE2 plus anything outside DOT_ that turns out to follow the creature.
#
# SIZE CANNOT BE CHANGED FROM HERE
# The aura is one bit in the abnormalEffect field of CharInfo, and no packet this
# server can send carries a scale. The client draws each effect at a size fixed in
# its own data, so there is no command and no config that makes an aura bigger.
# The only size-changing values in the enum, BIG_BODY and BIG_HEAD, scale the
# creature rather than the aura, which would be a comically large beast rather
# than a large glow.
#
#   Earth: DOT_SOIL  /  DOT_WATER  /  SHAKE  /  DOT_MP
#   Holy:  INVINCIBILITY  /  ULTIMATE_DEFENCE  /  FROZEN_PILLAR  /  NAVIT_ADVENT
#   Dark:  SPEED_DOWN  /  DOT_POISON  /  DOT_MP  /  DOT_SOIL  /  SILENCE
#
# Worth knowing before you pick: INVINCIBILITY, VP_KEEP and REAL_TARGET are not on
# these lists on purpose. The client draws them as "cannot be hurt" and "this is
# your target", and a cosmetic field is not a licence to draw a promise the server
# is not keeping. DEATH_MARK and NAVIT_ADVENT were left out for the same reason.
# VP_UP is the awakened overlay below, so it is not offered for an affinity either:
# the two effects would look identical and tell you nothing about which is which.

# Added on top of the affinity effect once the beast has awakened, so the permanent
# choice a player made is visible across a room.
# Set to NONE. The awakening's proc is a pure stat - Silence, Poison, Bleed and the rest -
# and a BIG_BODY overlay advertised a change to the creature that the proc itself never
# made. Nothing here reads the awaken stage for looks any more; the stage still decides
# which proc fires, it just no longer decides what the beast looks like.
AwakenedEffect = NONE

# The second awakening's overlay, same answer. Previously SLEEP, layered on top of
# BIG_BODY rather than replacing it, on the reasoning that a stage-one look disappearing
# when a beast grew stronger reads as a downgrade. With neither overlay set there is
# nothing to layer, so that argument has nothing to apply to.
AwakenedEffectSecond = NONE

# Rarity auras, layered the same way. A beast can wear its affinity effect, its
# awakened effect and one rarity effect at once; the client stacks them.
#
#   RARE and EPIC   get RarityEffectRare
#   LEGENDARY       gets RarityEffectLegendary
#   COMMON, UNCOMMON   get nothing
#
# Both are NONE by default, and that is deliberate rather than undecided. A rarity
# aura applies to every rare beast at once, so picking a name before it has been
# looked at means possibly dressing a few hundred beasts with something that turns
# out to be wrong. Common and uncommon beasts get nothing for the same reason that
# matters more: if everything is slightly decorated, nothing is.
#
# LEGENDARY does not also get the rare effect. One effect per source, so a beast
# never wears two copies of the same visual. If you would rather a legendary beast
# looked like a rare beast that had simply done well, set both keys to the same name.
#
# Audit with .tameaura <NAME> first - it stacks onto whatever the beast is already
# wearing, which is the only way to judge whether a second effect reads as layered
# or as a mistake.
RarityEffectRare = NONE
RarityEffectLegendary = NONE

# Second awakening: an on-hit proc that follows the beast's affinity, not its
# first awakening path. Level 60, one normal attack in twenty-five on average.
#
#   Fire  Bleed (burn)    Water  Slow    Wind  Silence
#   Earth Stun            Holy   Weakness  Dark  Poison
#
# These are stock Item Skill procs registered as trigger skills, so the core
# casts them server-side on attack and no client button is involved.
#
# AwakenedProcChance is the per-hit trigger chance, as a percentage from 0 to 100.
# It is a percentage and not a fraction, because the core tests it as
# "Rnd.get(100) < chance" and Rnd.get(100) returns 0..99. Writing 0.25 here means
# 1%, not 25%; a value in (0,1] is detected and multiplied by 100 as a courtesy to
# any config written against the old, wrong unit.
#
# The observed rate is a little lower again because each stock skill carries its
# own activateRate as a second roll applied on top. That, not the unit, is the
# reason a proc can feel rarer than the number here.
#
# Note the proc only rolls on ordinary hits. Creature's on-attack loop skips an
# ATTACK-type trigger when the blow is a critical, reserving those for CRITICAL
# triggers.
#
# Set AwakenedProc=false to switch the whole thing off.
AwakenedProc = true
AwakenedProcLevel = 60
AwakenedProcChance = 25

# --------------------------------------------------------- race matchup circle ---
# Every beast is strong against one race, weak against one other, and even against the
# remaining eleven:
#
#   ANIMAL -> BUG -> PLANT -> BEAST -> HUMANOID -> UNDEAD -> DIVINE
#          -> DEMONIC -> FAIRY -> CONSTRUCT -> GIANT -> DRAGON -> ELEMENTAL -> ANIMAL
#
# Each race is strong against the one after it and weak against the one before it. So an
# ANIMAL beast hits BUG harder and is softened by ELEMENTAL. No race is ever strictly
# better, which is the point: this is a reason to pick a beast for a fight, not a
# reason to pick one race and never use another.
#
# These are the core's own thirteen creature races, which is the only reason this is
# possible at all without editing the datapack - every creature in the game already
# reports a race, so the rule needs no new data. Races outside the circle (players'
# races, mercenaries, castle guards, siege weapons) fight on even terms.
#
# There is nothing to cast and no buff to apply. The bonus is read at the moment the
# server calculates the hit, against whatever the beast is hitting right now, so it
# follows a retarget instantly and cannot expire or be forgotten. It applies to
# physical and magical attack, and to both basic attacks and skills. It does not touch
# health, defence, speed, accuracy or experience.
#
# RaceAdvantagePct and RaceDisadvantagePct are percentages. The penalty is smaller than
# the reward on purpose: being outmatched should sting without making a fight unwinnable.
# Both accept 0 (which switches that side off) to 100; anything outside that range, or
# anything unparseable, falls back to 12 and 8 rather than producing a wild multiplier.
#
# Set RaceAdvantage=false to remove the circle entirely.
RaceAdvantage = true
RaceAdvantagePct = 12
RaceDisadvantagePct = 8

# ------------------------------------------------------- experience share ---
# OwnerExpPercent is the share of each kill's experience that you keep.
# TameExpPercent is the share you want your tame to END UP with, measured against
# your own gain. It is a target total, not an extra payment.
#
# Stock pet code cannot share, it can only move experience from you to your tame:
# it hands you OwnerExpPercent and gives the tame whatever is left over. The module
# then tops the tame up to TameExpPercent out of the same kill, so the tame is never
# paid twice for one kill.
#
#   100 / 100  both of you get 100% of every kill. Stock gives the tame nothing,
#               so the module grants a full extra share.
#    50 /  50  an even split. Stock already hands the tame the leftover 50%, so the
#               module grants nothing extra and the totals simply divide.
#    50 / 100  you get 50%, the tame gets 100% of your gain.
OwnerExpPercent = 100
TameExpPercent = 100

# ------------------------------------------------------ private npc id band ---
# Every collar gets its own synthetic NPC id inside this band, and a template is
# cloned into it. The band must match the npcs reserve in module.json, and no
# other module or script may use it. 100000 ids means 100000 collars before the
# band runs out, and ids are never reused, so widen the reserve before you get
# close rather than after.
SyntheticNpcIdLow = 700000
SyntheticNpcIdHigh = 799999
